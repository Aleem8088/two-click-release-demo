name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  build:
    name: Build and push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy jobs run only when the repo variable AZURE_DEPLOY is 'true'.
  # Until you set up Azure (infra/setup-azure.sh) the pipeline stays green and skips them.
  deploy-staging:
    name: Deploy to staging
    needs: build
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.app.outputs.url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update container app
        run: |
          az containerapp update \
            --name "${{ vars.APP_NAME }}-staging" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}"
      - id: app
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.APP_NAME }}-staging" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"
      - name: Smoke test (must serve this commit)
        run: bash scripts/smoke-test.sh "${{ steps.app.outputs.url }}" "${{ github.sha }}"

  # The "second click": this job uses the 'production' environment, which is
  # configured with a required reviewer. The run pauses here until it is approved.
  deploy-production:
    name: Deploy to production
    needs: [build, deploy-staging]
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.app.outputs.url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update container app
        run: |
          az containerapp update \
            --name "${{ vars.APP_NAME }}-production" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}"
      - id: app
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.APP_NAME }}-production" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"
      - name: Smoke test (must serve this commit)
        run: bash scripts/smoke-test.sh "${{ steps.app.outputs.url }}" "${{ github.sha }}"
